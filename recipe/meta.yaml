{% set name = "docstring-to-markdown" %}
{% set version = "0.17" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name|replace('-', '_') }}-{{ version }}.tar.gz
  sha256: df72a112294c7492487c9da2451cae0faeee06e86008245c188c5761c9590ca3

build:
  number: 0
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  skip: true  # [py<37]

requirements:
  host:
    - pip
    - python
    - setuptools
  run:
    - python
    - importlib-metadata >=3.6
    - typing_extensions >=4.6

test:
  source_files:
    - tests
  imports:
    - docstring_to_markdown
    - docstring_to_markdown.cpython
    - docstring_to_markdown.google
    - docstring_to_markdown.plain
    - docstring_to_markdown.rst
    - docstring_to_markdown.types
  requires:
    - pip
    - pytest
  commands:
    - pip check
    - python -c "from importlib.metadata import version; assert(version('{{ name }}')=='{{ version }}')"
    - pytest -v tests

about:
  home: https://pypi.org/project/docstring-to-markdown
  summary: On the fly conversion of Python docstrings to markdown
  description: |
    On the fly conversion of Python docstrings to markdown.
    Currently can recognise reStructuredText and convert multiple of its features to Markdown.
    In the future will be able to convert Google docstrings too
  license: LGPL-2.1-or-later
  license_file: LICENSE
  license_family: LGPL
  dev_url: https://github.com/python-lsp/docstring-to-markdown
  doc_url: https://github.com/python-lsp/docstring-to-markdown/blob/main/README.md

extra:
  recipe-maintainers:
    - bollwyvl
